aid: zurex-pharma
name: Zurex Pharma
description: 'Zurex Pharma, Inc. is a privately held specialty pharmaceutical and medical
  technology company founded in 2008 and headquartered in Middleton, Wisconsin, developing
  a portfolio of patented antimicrobial formulations intended to prevent healthcare-acquired
  infections. Its products are physical, regulated goods rather than software: ZuraPrep,
  a single-use pre-surgical skin antiseptic submitted to the FDA as NDA 210872 in June 2018;
  ZuraGard for peri-operative and catheter exit-site antisepsis; ZurAsept, a catheter lock
  solution; and ZuraLac, a teat sanitizer for dairy cattle. Backed by Baird Venture Partners,
  the State of Wisconsin Investment Board, Peak Ridge Capital and Wisconsin Investment Partners.
  The company publishes no developer program, no API and no machine-readable API artifacts of
  any kind, and as of this pass its own domain serves no website.'
